<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EURO FOOT — البث المباشر</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Tahoma,sans-serif;background:#07111f;color:#fff;min-height:100vh}
.container{max-width:1000px;margin:auto;padding:25px 18px}
.card{background:#0c1b2d;border:1px solid #1b334d;border-radius:16px;padding:18px}
h1{margin-bottom:10px}
p{color:#9eb1c7;line-height:1.8;margin-bottom:18px}
.player-wrap{background:#02070d;border:1px solid #1b334d;border-radius:16px;overflow:hidden}
.player{width:100%;aspect-ratio:16/9;background:#000;display:block}
button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:#39d98a;color:#06131f;cursor:pointer;font-weight:900}
</style>
</head>
<body>
<main class="container">
  <div class="card">
    <h1>🔴 البث المباشر</h1>
    <p>البث الذي فتحته من المباراة.</p>
    <div class="player-wrap">
      <video id="video" class="player" controls playsinline autoplay></video>
    </div>
    <button onclick="history.back()">← العودة للمباريات</button>
  </div>
</main>

<script>
const streamUrl = "https://live20.bozztv.com/akamaissh101/ssh101/mylive123/playlist.m3u8";
let hls = null;
const video = document.getElementById("video");

if (video.canPlayType("application/vnd.apple.mpegurl")) {
  video.src = streamUrl;
  video.play().catch(()=>{});
} else if (window.Hls && Hls.isSupported()) {
  hls = new Hls();
  hls.loadSource(streamUrl);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
} else {
  document.querySelector("p").textContent = "المتصفح لا يدعم تشغيل هذا البث.";
}
</script>
</body>
</html>
