<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FOOT 1 HD — البث المباشر</title><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Tahoma,sans-serif;background:radial-gradient(circle at 50% 0,#09265e,#020b22 50%,#010617);color:#fff;min-height:100vh}.container{max-width:1050px;margin:auto;padding:22px 18px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.top img{width:170px;max-width:45vw}.back{display:inline-block;padding:10px 14px;border-radius:10px;background:#082454;border:1px solid #1d68c8;color:#dceaff;text-decoration:none;font-weight:800}.card{background:linear-gradient(145deg,#071b3e,#020d27);border:1px solid #1767d6;border-radius:20px;padding:18px;box-shadow:0 15px 45px rgba(0,0,0,.3)}h1{font-size:28px;margin-bottom:7px}p{color:#b5c8e5;line-height:1.8;margin-bottom:18px}.player-wrap{background:#000;border:1px solid #1d5cae;border-radius:15px;overflow:hidden}.player{width:100%;aspect-ratio:16/9;display:block;background:#000}.status{margin-top:12px;padding:10px;border-radius:10px;background:#061a3a;color:#9fc6ff;text-align:center}</style></head><body><main class="container"><div class="top"><img src="assets/foot1hd.png" alt="FOOT 1 HD"><a class="back" href="index.html">← العودة للمباريات</a></div><div class="card"><h1>🔴 البث المباشر</h1><p>صفحة البث الخاصة بالمباراة التي اخترتها.</p><div class="player-wrap"><video id="video" class="player" controls playsinline autoplay></video></div><div id="status" class="status">جاري تحميل البث…</div></div></main><script>const streamUrl="https://live20.bozztv.com/akamaissh101/ssh101/mylive123/playlist.m3u8";const video=document.getElementById('video');const status=document.getElementById('status');let hls=null;if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=streamUrl;status.textContent='البث جاهز';video.play().catch(()=>{})}else if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(streamUrl);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>{status.textContent='البث جاهز';video.play().catch(()=>{})});hls.on(Hls.Events.ERROR,(e,data)=>{if(data&&data.fatal)status.textContent='تعذر تحميل البث حاليًا.'})}else{status.textContent='المتصفح لا يدعم تشغيل HLS.'}</script></body></html>
