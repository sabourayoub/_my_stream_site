<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بثي المباشر</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#fff;font-family:Arial,sans-serif}
header{padding:18px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #20232c}
.logo{font-size:24px;font-weight:800}.live{background:#e11d48;padding:7px 12px;border-radius:999px;font-size:13px}
main{max-width:1100px;margin:35px auto;padding:0 18px}
.player{aspect-ratio:16/9;background:#050608;border-radius:16px;display:flex;align-items:center;justify-content:center;border:1px solid #252936;overflow:hidden}
.player video{width:100%;height:100%;object-fit:contain}
.placeholder{text-align:center;color:#aeb4c2}.placeholder b{display:block;font-size:24px;margin-bottom:8px}
h1{margin:24px 0 8px}.sub{color:#9ca3af}.info{margin-top:25px;padding:20px;background:#12151d;border-radius:14px}
button{background:#fff;color:#111;border:0;padding:11px 18px;border-radius:10px;font-weight:700;cursor:pointer}
code{background:#080a0f;padding:3px 7px;border-radius:5px}
</style>
</head>
<body>
<header><div class="logo">📺 بثي المباشر</div><div class="live">● LIVE</div></header>
<main>
  <div class="player">
    <video id="video" controls autoplay muted playsinline></video>
    <div id="placeholder" class="placeholder">
      <b>البث غير متصل</b>
      ابدأ البث من OBS ليظهر هنا.
    </div>
  </div>
  <h1>البث المباشر</h1>
  <div class="sub">بث مباشر من الكمبيوتر</div>
  <div class="info">
    <h3>إعداد البث</h3>
    <p>هذه الواجهة جاهزة للموقع. لربطها ببث حقيقي نحتاج عنوان خادم البث وملف/رابط HLS أو WebRTC.</p>
    <p>مثال للرابط الذي سيضعه الموقع: <code>https://YOUR-SERVER/live/stream.m3u8</code></p>
  </div>
</main>
<script>
const STREAM_URL = "https://usb.bozztv.com/mylive123/index.m3u8";
const video = document.getElementById("video");
const placeholder = document.getElementById("placeholder");
if (STREAM_URL) {
  placeholder.style.display = "none";
  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = STREAM_URL;
  } else {
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/hls.js@latest";
    script.onload = () => {
      if (window.Hls && Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(STREAM_URL);
        hls.attachMedia(video);
      } else {
        placeholder.style.display = "block";
        placeholder.innerHTML = "<b>المتصفح لا يدعم تشغيل البث</b>جرّب Chrome أو Edge أو Safari.";
      }
    };
    script.onerror = () => {
      placeholder.style.display = "block";
      placeholder.innerHTML = "<b>تعذر تحميل مشغل البث</b>تحقق من اتصال الإنترنت.";
    };
    document.head.appendChild(script);
  }
}
</script>
</body>
</html>
